name: Xbox 360 toolchain smoke build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/xsdk-smoke.yml'
      - 'scripts/ci-xsdk-smoke.sh'
      - 'probes/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'cmake/**'

permissions:
  contents: read

jobs:
  xsdk-smoke:
    name: Build official xsdk hello and triangle samples
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      JOBS: '2'
    steps:
      - name: Check out this porting repository
        uses: actions/checkout@v4

      - name: Install xsdk build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev curl xz-utils patch python3 cmake ninja-build git glslang-tools
          cmake --version
          python3 --version
          glslangValidator --version

      - name: Build pinned xsdk toolchain and official samples
        env:
          SMOKE_ROOT: ${{ runner.temp }}/shipwright-xsdk-smoke
        run: bash scripts/ci-xsdk-smoke.sh

      - name: Upload compiler logs and generated XEX files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xsdk-smoke-build-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/shipwright-xsdk-smoke/logs/**
            ${{ runner.temp }}/shipwright-xsdk-smoke/xsdk/build/samples/**/*.xex

